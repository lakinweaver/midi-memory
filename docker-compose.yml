# The library server. `docker compose up -d`, then open http://<this-host>:8080
# and add a capture client from Settings.
services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: midi-memory-server
    container_name: midi-memory
    ports:
      # DSM, Web Station and a few other things like 8080. If the container
      # cannot start because the port is taken, change the left-hand number.
      - "8080:8080"
    volumes:
      # Recordings and the database. Back this up and you have backed up
      # everything that matters.
      - ./data:/data
    environment:
      # Who the server runs as, and who ./data ends up belonging to. These
      # default to the docker user on Lakin's Synology; override them in a .env
      # file beside this one (see .env.example) on any other box.
      #
      # Set either to empty and the container adopts whoever already owns
      # ./data instead, which suits a machine whose uid you do not know.
      PUID: "${PUID:-1030}"
      PGID: "${PGID:-100}"
      # Set a password to put the library behind a login. Left empty, anyone on
      # the network can open it -- which is often what you want at home, and
      # never what you want if this is reachable from outside it.
      MIDI_MEMORY_PASSWORD: "${MIDI_MEMORY_PASSWORD:-}"
    restart: unless-stopped
