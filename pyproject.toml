[project]
name = "midi-memory"
version = "0.1.0"
description = "Always-on MIDI notepad: continuously records a digital piano and files the ideas into browsable sessions."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
    "itsdangerous>=2.2",
    "mido>=1.3.3",
]

[project.optional-dependencies]
# Linux / Raspberry Pi: native ALSA sequencer input. Pure Python, no compilation.
alsa = ["alsa-midi>=1.0.4"]
# macOS/Windows: optional live USB MIDI input for development. Needs CPython <= 3.13.
portable = ["rtmidi2>=1.4.1"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
midi-memory = "app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
