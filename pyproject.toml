[project]
name = "midi-memory"
# Read from midi_memory.__version__ so there is one place to bump.
dynamic = ["version"]
description = "Always-on MIDI notepad: capture clients record a digital piano continuously and file the ideas into a browsable library on a server."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
    "mido>=1.3.3",
]

[project.optional-dependencies]
# The library server: adds cookie signing for the browser login.
server = ["itsdangerous>=2.2"]
# A capture client: adds the HTTP client it uploads with, and cookie signing
# for its own settings page.
client = ["httpx>=0.27", "itsdangerous>=2.2"]
# Linux / Raspberry Pi: native ALSA sequencer input. Pure Python, no compilation.
alsa = ["alsa-midi>=1.0.4"]
# macOS/Windows: optional live USB MIDI input for development. Needs CPython <= 3.13.
portable = ["rtmidi2>=1.4.1"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "itsdangerous>=2.2"]

[project.scripts]
midi-memory-server = "midi_memory.server.__main__:main"
midi-memory-client = "midi_memory.client.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "midi_memory.__version__"}

[tool.setuptools.packages.find]
include = ["midi_memory*"]

[tool.setuptools]
# Only the globs below ship. Left on, setuptools also sweeps in whatever the
# working tree happens to hold, which for the piano samples means the wheel
# depends on whether the person building it had run the downloader.
include-package-data = false

[tool.setuptools.package-data]
# static/audio is deliberately absent: the piano samples are generated, not
# source, so a wheel built on a machine that happens to have them would differ
# from one built on a machine that does not. They are fetched at image build
# time, by the installer, or from the Settings dialog.
"midi_memory.server" = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/fonts/*",
    "static/brand/*",
]
"midi_memory.client" = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/brand/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
