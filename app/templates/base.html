<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100E0C">
  <title>{% block title %}MIDI Memory{% endblock %}</title>
  <link rel="stylesheet" href="{{ static('css/app.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23100E0C'/><circle cx='16' cy='16' r='6' fill='%23E8913F'/></svg>">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a href="/" class="wordmark">MIDI&nbsp;<b>Memory</b> <span>always listening</span></a>
    <div class="console">
      <div class="readout device">
        <span class="lamp" id="lamp-device"></span>
        <span class="val" id="device-name">connecting…</span>
      </div>
      <div class="readout">
        <span class="lamp" id="lamp-rec"></span>
        <span class="val" id="rec-state">idle</span>
      </div>
      <a class="readout piano-readout" id="piano-readout" href="#" hidden
         title="Playing on the instrument - click to stop">
        <span class="lamp play"></span>
        <span class="val" id="piano-state">on piano</span>
      </a>
      {% if request.app.state.auth.enabled %}
      <a href="/logout" class="nav-link">Sign out</a>
      {% endif %}
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>
</div>

<div class="toasts" id="toasts"></div>
<script src="{{ static('js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
