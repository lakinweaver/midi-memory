<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100E0C">
  <title>Sign in · MIDI Memory capture client</title>
  <link rel="stylesheet" href="{{ static('css/client.css') }}">
  <link rel="icon" href="{{ static('brand/icon.svg') }}" type="image/svg+xml">
  <link rel="icon" href="{{ static('brand/icon-32.png') }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ static('brand/icon-180.png') }}">
</head>
<body>
<div class="shell login-wrap">
  <form class="login-card" method="post" action="/login">
    <div class="wordmark">MIDI<b>Memory</b></div>
    <p>capture client</p>
    {% if error %}<div class="login-err">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="Password"
           autocomplete="current-password" autofocus required>
    <button class="btn primary" type="submit">Enter</button>
  </form>
</div>
</body>
</html>
